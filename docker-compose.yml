version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vaxitrack_user
      POSTGRES_PASSWORD: vaxitrack_pass
      POSTGRES_DB: vaxitrack_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: