name: API Tests

on: [push, pull_request]

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
      db:
        image: postgres:15
        env:
          POSTGRES_USER: vaxitrack_user
          POSTGRES_PASSWORD: vaxitrack_pass
          POSTGRES_DB: vaxitrack_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaxitrack_user -d vaxitrack_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Start server in background
        run: |
          nohup npm start &
          sleep 15

      - name: Run Newman tests
        run: npm run test:api
